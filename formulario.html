<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo_formulario.css">
    <title>Formulario</title>
</head>
<body>
    <div class="logo">
     <img src="imagen_.png"href="index_2.html"></div>
    <h1>mi primer formulario </h1>
    <form action="proceso.php" method="post" enctype="multipart/form-data"> 

<fieldset>
    <legend>datos personales</legend>
        <label for="nombre">nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="nombre" required> 
        
        <br>

        <label for="mail">Correo electronico</label>
        <input type="email" id="mail" name="mail" placeholder="correo@empresa.com">

        <br>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="contraseña">     
        
        <br>

        <label for="telefono">telefono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="telefono">   
        
        <br>

        
        <label for="web">sitio web</label>
        <input type="url" id="web" name="web">    <br>

        
        <label for="busqueda">Busqueda</label>
        <input type="search" id="busqueda" name="busqueda">     <br>
        
</fieldset>
<fieldset><legend>NUMEROS Y RANGOS</legend>
<input type="number" id="edad" name="edad" min="18" max="75"> </input> <br>

<label for="satisfacion">nivel de satisfación</label>
<input type="range" name="" id="satisfacion" min="1" max="10"> <br>
</fieldset>

<!-- Grupo 4: Selección y Opciones -->
    <fieldset>
        <legend>Selección y opciones</legend>

        <p>Género</p>

        <label for="masculino">Masculino</label>
        <input type="radio" id="masculino" name="genero" value="M">
        <br>

        <label for="femenino">Femenino</label>
        <input type="radio" id="femenino" name="genero" value="F">
        <br><br>

        <p>Intereses</p>

        <label for="tecnologia">Tecnología</label>
        <input type="checkbox" id="tecnologia"
               name="interes[]" value="tecnologia">
        <br>

        <label for="deportes">Deportes</label>
        <input type="checkbox" id="deportes"
               name="interes[]" value="deportes">
        <br>

        <label for="musica">Música</label>
        <input type="checkbox" id="musica"
               name="interes[]" value="musica">
        <br>

        <label for="arte">Arte</label>
        <input type="checkbox" id="arte"
               name="interes[]" value="arte">
        <br><br>

        <label for="comida">Mi rol preferido</label>
        <input type="text" id="comida" name="comida" list="lista">

        <datalist id="lista">
            <option value="Duelista">
            <option value="Centinela">
            <option value="Iniciador">
            <option value="Controlador">
        </datalist>
        </fieldset>

<fieldset>
    <legend>fecha y hora</legend>
    <label for="fecha">fecha de nacimiento</label>
    <input type="date" id="fecha" name="fecha"> <br>

      <label for="hora">eleccion de hora</label>
    <input type="time" id="hora" name="hora"> <br>

          <label for="hora">eleccion de hora</label>
    <input type="datetime-local" id="fecha-hora" name="fecha-hora"> <br>
    
          <label for="mes">Mes de inicio</label>
    <input type="month" id="mes" name="mes"> <br>

    
          <label for="semana">Semana</label>
    <input type="week" id="semana" name="semana"> <br>


<br>
<br>

<label for="comida">mi comida preferida</label>
<input type="text" list="mi-comida" id="comida" name="comida">
<datalist id="mi comida"></datalist>
<option value="Lomo saltado">
<option value="Ají de gallina">
<option value="Arroz con pollo">
<option value="tallarines verdes">
    
<fieldset>


</fieldset>
    
</fieldset>
<fieldset>
    <legend>Archivos y multimedia</legend>
<label for="archivo">subir archivo</label>
<input type="file" id="archivo"name="archivo">
<br>
<br>
</fieldset>
    <button type="submit">Enviar formulario</button>
    <input type="color" id="color" name="color" value="">
    <br>
    <br>
    </fieldset>
   
    <legend>Textos extensos y ocultos</legend>
    <label for="biografía">Cuento infantil</label>
    <textarea name="biografía" name="biografía" rows="5" cols="60" placeholder="Escribe tu biografía"></textarea>
    <br>
</fieldset>
<br>
<input type="hidden" name="usuario" value="limpiar formulario">
<input type="submit" name="usuario" value="enviar formulario">
</form>
</body>
</html>
